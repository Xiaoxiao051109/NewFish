  # 鱼获重量与品级。
  # 每次钓到自定义鱼都会掷一个重量：以 base-kilograms 为基准上下浮动，
  # 离基准越远品级越高。重量会写入物品 PDC，并计入图鉴/个人最佳/全服纪录。
  weight:
    enabled: true
    # 未在 base-kilograms 里单独配置的鱼使用的基准重量（千克）。
    default-base-kilograms: 1.0
    # 浮动幅度：实际重量在 base × (1 ± variance) 之间均匀取值。0.35 即 ±35%。
    variance: 0.35
    # 达到 base × 该倍率即为传说档。必须大于 1 + variance / 2，否则传说档永远取不到。
    legendary-factor: 1.6
    # 钓到传说档时是否向全服播报。
    broadcast-legendary: true
    # 各鱼种的基准重量，按需覆盖 default-base-kilograms。
    base-kilograms:
      anchovy: 0.3
      angelfish: 0.8
      arapaima: 12.0
      arowana: 4.0
      barbel_steed: 2.0
      barred_knifejaw: 3.5
      bass: 2.0
      bitterling: 0.1
      bluegill: 0.5
      brook_trout: 0.6
      carp: 3.0
      catfish: 6.0
      cherry_salmon: 1.2
      coelacanth: 20.0
      crawfish: 0.2
      crucian_carp: 1.0
      dab: 0.8
      dace: 0.4
      eel: 1.5
      freshwater_goby: 0.3
      frog: 0.2
      giant_catfish: 25.0
      giant_snakehead: 15.0
      goldfish: 0.3
      guppy: 0.1
      horse_mackerel: 1.0
      jellyfish: 1.5
      killifish: 0.2
      koi: 3.0
      large_bass: 4.0
      large_char: 5.0
      lobster: 2.0
      loach: 0.3
      marlin: 40.0
      octopus: 5.0
      olive_flounder: 1.5
      pale_chub: 0.8
      piranha: 1.2
      pond_smelt: 0.2
      popeyed_goldfish: 0.3
      rainbow_trout: 1.5
      red_snapper: 2.5
      sea_bass: 3.0
      seahorse: 0.4
      small_bass: 1.2
      squid: 1.0
      stringfish: 8.0
      sweetfish: 0.6
    # 三档品级的显示名与颜色。
    grades:
      common:
        name: 普通
        color: GRAY
      rare:
        name: 稀有
        color: AQUA
      legendary:
        name: 传说
        color: GOLD

codex:
  # 图鉴是否启用。关闭后 /newfish codex 会提示未启用，且不再记录收集进度。
  enabled: true
  # 首次钓到某个鱼种时是否给玩家发一条进度提示。
  announce-first-catch: true
  # 未收录鱼种在列表里显示的名称。
  unknown-name: '???'
  # %newfish_top% 与纪录榜最多显示多少条。
  top-limit: 5

