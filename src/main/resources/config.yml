enchantments:
  enabled: true
  # NewFish 附魔已在引导期由 NewFishBootstrap 注册为**真正的原版附魔**，
  # 但被刻意配置成「只能通过钓鱼获得」：
  #   · 附魔台权重压到原版最低值 1；
  #   · 成本区间下界抬到 60，远超 30 级附魔台能达到的成本上限。
  # 因此附魔台与图书管理员村民都抽不到它们，唯一正常来源是下面的 natural-loot。
  # 铁砧合并、/enchant 手动给予不走这套筛选，仍可正常使用（供管理员调试）。
  #
  # 下面这些开关只控制「对应的功能监听器」是否生效。
  sea_lure: true
  treasure_hunter: true
  hooked_strike: true
  ender_hook: true
  water_trail: true
  dolphins_grace: true
  thundering: true
  water-trail:
    max-active-arrows: 64
    max-blocks-per-arrow: 24
    max-distance: 48
    lifetime-ticks: 20
  # 钓鱼产出附魔物品的概率与去向 —— 这是 NewFish 附魔的**唯一正常获取途径**。
  # 每次从钓鱼宝藏池抽到 enchanted 条目时，按下面的池子随机附加一个 NewFish 附魔。
  natural-loot:
    enabled: true
    # 抽到附魔物品后，成功附上附魔的概率（0~1）。1.0 表示必附。
    chance: 0.35
    # 各目标类型可随机到的附魔（按 ID）。
    pool:
      # 鱼竿：海之诱饵 / 宝藏猎人 / 鱼钩猛击 / 末影鱼钩
      rod: [sea_lure, treasure_hunter, hooked_strike, ender_hook]
      # 弓：水痕
      bow: [water_trail]
      # 附魔书：全部七种都会出现，因此书本是最全的获取途径。
      book: [sea_lure, treasure_hunter, hooked_strike, ender_hook, water_trail, dolphins_grace, thundering]
    # 各附魔出现时的等级：给一个区间，随机取整数（含两端）。
    levels:
      default: [1, 1]
      sea_lure: [1, 3]
      treasure_hunter: [1, 3]
      hooked_strike: [1, 3]
      water_trail: [1, 3]
